name: Dependency Review

# Requires the repository Dependency Graph to be enabled
# (Settings > Code security > Dependency graph). Without it the action
# fails at runtime with "Dependency review is not supported on this
# repository" even when the action SHA resolves correctly.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
